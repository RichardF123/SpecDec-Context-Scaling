[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specdec"
version = "0.1.0"
description = "From-scratch small-LLM inference engine + speculative decoding (course project)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "transformers>=4.44",
  "tokenizers>=0.19",
]

[project.optional-dependencies]
colab = ["bitsandbytes>=0.43", "peft>=0.12", "accelerate>=0.33", "datasets>=2.20"]
eval = ["lm-evaluation-harness"]

[project.scripts]
specdec = "specdec.cli:main"

[tool.setuptools.packages.find]
include = ["specdec*"]
